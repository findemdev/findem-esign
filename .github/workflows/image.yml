name: Export published Sign image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install registry copy tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Export immutable published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          authfile=$(mktemp)
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" --username "$GH_USER" --password-stdin ghcr.io
          skopeo copy --src-authfile "$authfile" --all --preserve-digests docker://ghcr.io/findemdev/findem-esign@sha256:8d7f2c1bab50055ce6ff1d50eb55dc446388a9a8204c8e88a9c02b19cbb30f88 dir:sign-image
          test "$(sha256sum sign-image/manifest.json | cut -d' ' -f1)" = 8d7f2c1bab50055ce6ff1d50eb55dc446388a9a8204c8e88a9c02b19cbb30f88
          tar -cf sign-image.tar sign-image
          sha256sum sign-image.tar > sign-image.tar.sha256
      - name: Save release transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sign-image-94dfff8
          path: |
            sign-image.tar
            sign-image.tar.sha256
          retention-days: 1
          compression-level: 0
